# Karnataka (state 1). Source IDs and verify tasks from docs/plan.pdf sections 6 and 16.
# Every source starts disabled. Enable one only after its verify task passes and
# verified_by points to that evidence. Secrets: env var NAMES only, never values.
state_id: ka
name: Karnataka
storage_tz: UTC
display_tz: Asia/Kolkata
paths:
  raw_root: data/raw/ka
  clean_root: data/clean/ka
  publish_root: data/publish/ka
sources:
  - source_id: S01
    name: "Open-Meteo weather forecast"
    verify_task: T009
    cost: free
    storage_crs: EPSG:4326
    schedule: "every 6 hours"
    enabled: true
    verified_by: configs/sources/s01.yaml
  - source_id: S02
    name: "Open-Meteo historical weather / ERA5"
    verify_task: T011
    cost: free
    storage_crs: EPSG:4326
    schedule: "backfill once; daily delayed updates"
    enabled: true
    verified_by: configs/sources/s02.yaml
  - source_id: S03
    name: "Open-Meteo GloFAS river discharge"
    verify_task: T047
    cost: free
    storage_crs: EPSG:4326
    schedule: "daily; hindcast unless stored at issue time"
    verified_by: configs/sources/s03.yaml
    enabled: true
  - source_id: S04
    name: "Open-Meteo CAMS air-quality estimates"
    verify_task: T049
    cost: free
    storage_crs: EPSG:4326
    schedule: "every 6 hours"
    verified_by: configs/sources/s04.yaml
    enabled: true
  - source_id: S05
    name: "Open-Meteo ensemble"
    verify_task: T051
    cost: free
    storage_crs: EPSG:4326
    schedule: "daily; store every run (no archive of runs)"
    verified_by: configs/sources/s05.yaml
    enabled: true
  - source_id: S06
    name: "Open-Meteo climate projections"
    verify_task: T053
    cost: free
    storage_crs: EPSG:4326
    schedule: "once per product revision; split long ranges (weighted calls)"
    verified_by: configs/sources/s06.yaml
    enabled: true
  - source_id: S07
    name: "NASA POWER daily point"
    verify_task: T055
    cost: free
    storage_crs: EPSG:4326
    schedule: "backfill; monthly; split requests that mix products"
    verified_by: configs/sources/s07.yaml
    enabled: true
  - source_id: S08
    name: "IMD Pune gridded rainfall 1901-2024"
    verify_task: T057
    cost: free
    schedule: "yearly check"
    enabled: true
    verified_by: configs/sources/s08.yaml
  - source_id: S09

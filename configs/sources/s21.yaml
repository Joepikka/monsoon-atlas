units:
  status: labelled
  detail: >-
    The README shows the shapes (e02): stations are GeoJSON points (longitude, latitude) with
    code, name, state and zone; trains are GeoJSON lines; schedules are an array of stops with
    train_number, station_code, arrival, departure ("HH:MM:SS" clock text or the string "None")
    and day (journey day). The files match: 8,990 stations (293 without geometry, 301 in
    Karnataka), 5,208 trains and 417,080 stops with the same eight keys (e06-e08).
  evidence: [e02, e06, e07, e08]

source_check:
  status: pass
  detail: >-
    Plan rule: old schedules shown as historical reference, never current ETAs; pin the commit
    hash. The data stopped changing on 8 Aug 2016 (e04), so every time is a 2016 timetable entry,
    not a current or predicted time; T074 pins commit e0c538a1 in its URLs and labels times as
    historical. Arrival is "None" at 5,174 first stops and departure "None" at 5,164 last stops;
    these become null. Stops have no sequence field: stop ids rise in file order within 5,199 of
    5,208 trains, so the sequence is the file order and the 9 other trains are flagged (e08).
  evidence: [e04, e08]


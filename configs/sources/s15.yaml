access:
  status: public_tiles_no_key
  detail: >-
    The public instance is free with "no limits on the number of map views or requests" and "no
    registration, no user database, no API keys, and no cookies" (e02). The quick start names the
    style URLs (e04); the style, TileJSON and a vector tile download without an account (e05, e06,
    e07). The website robots.txt allows all paths (e01); the tile host's robots.txt returns 403
    (see failed_fetches). Requests were spaced 3 seconds apart.
  evidence: [e01, e02, e04, e05, e06, e07]

licence:
  status: open
  detail: >-
    The TileJSON attribution, which must be shown on every map, credits OpenFreeMap, "©
    OpenMapTiles" and "Data from OpenStreetMap" (e06); OpenStreetMap data is ODbL. The Terms of
    Service forbid collecting data "in automated ways, except for offline downloads" of at most
    3,000 tiles or 50 MB, with at most 4 parallel requests and a unique User-Agent, and require
    whoever integrates the public service into a site to be at least 18 (e03). Maps are drawn in
    the viewer's browser, so the project does not bulk-download tiles.
  evidence: [e03, e06]

provider_quota:
  status: published
  detail: >-
    No limit on map views (e02); automated downloads at most 3,000 tiles or 50 MB each, at most 4
    parallel requests (e03).
  evidence: [e02, e03]

history:
  status: partial
  detail: >-
    Tiles are served from a dated revision path; on 5 Nov 2026 the TileJSON pointed at
    20261101_080013_pt (OpenMapTiles schema 3.16.0) (e06). Only the current revision is
    advertised, so the style and its attribution are saved at each release (e05, e06).
  evidence: [e05, e06]

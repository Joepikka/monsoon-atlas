    unit_status: not_applicable
    detail: "Assigned: bmtc or bmrcl, one per pinned repository commit."
    evidence: [e11, e12]
  - canonical: service_date
    upstream: "calendar.txt days and date range, calendar_dates.txt exceptions"
    unit_status: labelled
    detail: "Local service date (Asia/Kolkata) on which the trip's service_id runs."
    evidence: [e11, e12]
  - canonical: trip_id
    upstream: "stop_times.trip_id"
    unit_status: not_applicable
    detail: "Trip identifier, unique within a feed."
    evidence: [e11, e12]
  - canonical: route_id
    upstream: "trips.route_id"
    unit_status: not_applicable
    detail: "Route identifier joined from trips.txt."
    evidence: [e11, e12]
  - canonical: stop_id
    upstream: "stop_times.stop_id"
    unit_status: not_applicable
    detail: "Stop or platform identifier (BMRCL platforms have a parent station)."
    evidence: [e11, e12]
  - canonical: stop_sequence
    upstream: "stop_times.stop_sequence"
    unit_status: not_applicable
    detail: "Integer order within a trip; strictly rising in every trip of both feeds."
    evidence: [e11, e12]
  - canonical: arrival_sec
    upstream: "stop_times.arrival_time"
    unit_status: labelled
    detail: "Seconds after noon minus 12 h of the service date; may exceed 86,400."
    evidence: [e11, e12]
  - canonical: departure_sec
    upstream: "stop_times.departure_time"
    unit_status: labelled
    detail: "Seconds after noon minus 12 h of the service date; may exceed 86,400."
    evidence: [e11, e12]


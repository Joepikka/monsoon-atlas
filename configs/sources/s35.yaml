source_check:
  status: fail
  detail: >-
    The plan requires dated location-level labels and says an aggregate rain table cannot validate a
    classifier. e03, e04 and e05 are monthly or annual rainfall tables with a flood flag, so they
    are rejected. e01 holds district totals for one event (August 2018); whether it has daily dated
    rows cannot be checked without sign-in, and its data comes from the official memorandum, which
    is S36's scope (e06). e02 has no stated origin and is rejected. None gives flood labels before
    2018, which M08 needs for any forecasting claim (independent positives and negatives before
    2018) (e01 to e06).
  evidence: [e01, e02, e03, e04, e05, e06]


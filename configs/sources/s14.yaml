licence:
  status: open
  detail: >-
    The registry names the attribution page as the licence (e01). It says "Attribution is required
    for many terrain tile data providers" and lists them; for India the global sources are SRTM and
    GMTED2010 ("courtesy of the U.S. Geological Survey") and ETOPO1 (NOAA), which are US Government

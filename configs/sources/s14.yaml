  evidence: [e01, e02]

provider_quota:
  status: not_published
  detail: "The registry entry and docs publish no request limit (e01, e03); tiles are fetched only for the map view."
  evidence: [e01, e03]

history:
  status: available
  detail: >-
    A static global tile set: "New data is added based on community feedback" (e01). There is no
    time dimension, so no earliest or latest date applies.
  evidence: [e01]
earliest_date: null
latest_date: null

units:
  status: labelled
  detail: >-
    "Terrarium format PNG tiles contain raw elevation data in meters, in Web Mercator projection
    (EPSG:3857)"; decode as (red * 256 + green + blue / 256) - 32768; the data range is -11000 to
    8900 metres (e03). Tiles are 256 x 256 RGB PNGs (e05, e06).
  evidence: [e03, e05, e06]

source_check:
  status: pass
  detail: >-
    Plan rule: decode Terrarium as R*256+G+B/256-32768 metres; validate sea-level samples. With
    that formula the Bengaluru tile (z10) decodes to 767 to 960 m and its centre to 879 m, in line
    with the city's plateau (e05); the Arabian Sea tile (z8) is negative down to -2,488 m, which is
    sea-floor depth, not missing data, with its few positive pixels at the coast (e06). Elevation
    below 0 over the sea is bathymetry and must not be read as land below sea level.
  evidence: [e03, e05, e06]


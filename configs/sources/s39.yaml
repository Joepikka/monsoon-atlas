access:
  status: token_required_owner_step
  detail: >-
    Every request goes to https://api.telegram.org/bot<token>/METHOD_NAME over HTTPS, and "Each
    bot is given a unique authentication token when it is created" (e01, e04). Creating the bot
    and the public channel is owner step H08 (amendments A5); no token is configured, so nothing
    was sent.
  evidence: [e01, e04]

licence:
  status: restricted
  detail: >-
    The Bot Developer Terms say continued use of the Bot Platform "shall constitute your
    acceptance" of them and of the Telegram Terms of Service and Privacy Policy, and require a
    privacy policy for any personal data handled (e03). Accepting terms is an owner step; the
    project posts only its own public alert briefs and collects no user data.
  evidence: [e03]

provider_quota:
  status: published
  detail: >-
    "In a single chat, avoid sending more than one message per second"; groups allow 20 messages
    per minute; free broadcasts about 30 messages per second; beyond that 429 errors (e02). Flood
    control answers carry retry_after, the seconds to wait (e01).
  evidence: [e01, e02]

history:
  status: not_public
  detail: "An output channel: the project sends messages and reads no history (e01)."
  evidence: [e01]

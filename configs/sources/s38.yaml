dependents: [T149, T150, T151, T152, T153, T156]
retry_condition: >-
  The owner completes H04 in a browser: submits the real time key request and the static data
  forms at otd.delhi.gov.in with an honest purpose (non-commercial research), accepts the Terms,
  keeps the key in .env as OTD_API_KEY (variable name only in code), and downloads the static
  GTFS ZIP into data/raw/S38. Then T148 is re-run to record one VehiclePositions sample, its
  protobuf fields, units, timestamp meaning, trip and calendar match against the static files,
  the key quota and whether the Terms allow the project's use; the source is enabled only if
  the licence allows it and the field map is verified. Approval may take time (e08).


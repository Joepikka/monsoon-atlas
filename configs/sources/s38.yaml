access:
  status: form_and_key_required_owner_step
  detail: >-
    Both feeds sit behind an owner step (H04, amendments A5). Static GTFS: each file on the bus
    page (stops, routes, stop_times, trips) and the DMRC page opens a form that asks for usage
    type, purpose, name and email and a tick to accept the Terms, then POSTs to /data/static/
    (e02, e03); the pages publish no direct file URL. Real time: the documented path is
    /api/realtime/VehiclePositions.pb?key=YOUR_PRIVATE_KEY, for "authorised users" (e05), and the
    key comes from the registration form at /data/realtime (name, email, phone, company, usage
    type, purpose, terms; e04). A request to that path without a key returned HTTP 401 on
    10 Nov 2026 (failed_fetches), so the API host is up. Registering, submitting either form and
    accepting the Terms are owner-only actions, so no file, key or sample was obtained. No card
    is asked for on any captured page. Only VehiclePositions is documented; no TripUpdates or
    ServiceAlerts path is published (e05).
  evidence: [e02, e03, e04, e05]

licence:
  status: restricted
  detail: >-
    No open licence is stated. The Terms say the Contents are protected by copyright owned or
    controlled by DoT (clause 3) and that using any dataset requires agreeing to state the
    content, intent, manner, time frame and identity of the user, with DoT free to refuse
    (clause 6, e06; e07 says use "constitutes acceptance"). Clause 22 lets material be reproduced
    free of charge if reproduced accurately, not in a derogatory or misleading context, and with
    the source prominently acknowledged; clause 7 treats modification or use for another purpose
    as a violation. Clause 8 forbids use to track or profile individuals, or in combination with
    other datasets so as to contribute to that. Clause 5 requires a user account for real time
    data. Redistribution of the feed is not granted, so redistribution_allowed stays false and
    raw files stay local.
  evidence: [e06, e07, e04]

provider_quota:
  status: not_published
  detail: >-
    No rate limit, polling interval or key quota appears on the home, data, documentation,
    announcements or contact pages (e01 to e09). The announcements only say key authorisation
    "might take time" and list batches authorised between Nov 2018 and Feb 2019 (e08).
  evidence: [e04, e05, e08]

history:
  status: not_public
  detail: >-
    No archive is described. Static files show last-updated dates of June 20, 2024 (bus: 3,464
    stops, 543 routes, 378,324 stop times, 16,562 trips) and Aug 10, 2023 (DMRC: 262 stops, 36
    routes, 411,686 stop times, 17,997 trips) (e02, e03); these are the dates of the current
    snapshot, not a data history. The real time feed is described as a live endpoint only (e05).
    The newest announcement is dated April 2019 (an outage notice) and the footer says 2017-2023,
    so whether the live feed is maintained is unknown until a key exists (e08).
  evidence: [e02, e03, e05, e08]
earliest_date: null
latest_date: null

units:
  status: unlabelled
  detail: >-
    The documentation lists the GTFS file names and warns that stop_times arrival and departure
    times are "a rough estimate generated by assuming a constant speed of travel", not
    observations (e05). It states no unit or time zone for the position feed, no timestamp
    semantics, no protobuf field list and no feed version scheme, and points to Google's GTFS
    pages for the file format (a third-party page, not used). Units, vehicle timestamps and
    trip linkage are therefore unverified.
  evidence: [e05]

source_check:
  status: blocked
  detail: >-
    Plan check: vehicle timestamps; map matching within 100 m; trip and calendar match; no
    trip_id means no scheduled delay label. None could be run: no GTFS file and no vehicle
    position was obtained (e02, e04, e05). The published warning makes static stop_times
    approximate, so no scheduled-delay label may be built from them without a verified feed.
    Vehicle positions are inferred, never official arrivals, and nothing here supports an ETA
    claim. The Terms bar tracking or profiling individuals (e06), so any future use keeps
    vehicles, not people, and the disabled adapter publishes no rows.
  evidence: [e02, e04, e05, e06]


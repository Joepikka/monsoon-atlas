    attempted_at: "2026-11-09T07:23:25Z"
    error: "HTTP 403 to the scripted client; robots.txt could not be read"
  - url: "https://opensky-network.org/"
    attempted_at: "2026-11-09T07:23:29Z"
    error: "HTTP 403 to the scripted client"
  - url: "https://opensky-network.org/about/terms-of-use"
    attempted_at: "2026-11-09T07:23:33Z"
    error: "HTTP 403 to the scripted client; the terms and data licence could not be read"

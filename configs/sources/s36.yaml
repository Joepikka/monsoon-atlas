    detail: "14 districts; spellings vary and must be mapped to district IDs. Never downscaled."
    evidence: [e06, e07]
  - canonical: event_date
    upstream: "'as on' date of a table, or a dated sentence; otherwise the memorandum period"
    unit_status: not_applicable

provider_quota:
  status: not_published
  detail: "No quota is published; robots.txt disallows only /wp-admin/ (e01)."
  evidence: [e01]

history:
  status: partial
  detail: >-
    One-off documents, not a series. The Disaster Memoranda page lists memoranda from 2012 to
    2024, including two for the 2018 floods: Memorandum 1 (29 May to 31 Jul 2018, submitted
    7-08-2018) and the Additional Memorandum (1 to 30 Aug 2018, submitted 13-09-2018) (e03, e06,
    e07). Each gives district totals for its whole period. Only one table has a date per district:
    NRSC flooded area in 7 districts "as on 16-7-2018", total 55,007 ha (e06, page 9). Other dated
    district statements are narrative, for example flooding in Wayanad, Kannur and Malappuram on
    8 and 9 August (e07, page 12). Before 2018 the captured flood-season document is the June 2013
    monsoon calamity memorandum: 891 villages affected by landslide, flood and/or windfall,
    with district totals for 1 to 30 June (e11). The event maps for 2013 and 2018 are single map
    images with a year only and "Reference purpose only" (e05, e09, e10). The PDNA (October 2018)
    cites a Government Order dated 03/10/2018 listing villages notified as flood or landslide
    affected, but that order is not linked from these pages (e08, page 319).
  evidence: [e03, e05, e06, e07, e08, e09, e10, e11]
earliest_date: "2013-06-01"
latest_date: "2018-08-30"

units:
  status: labelled
  detail: >-
    District tables state their units in the header: "Flooded Area (ha)" (e06, page 9),
    fatalities as counts with relief "@ 4 lakhs" (e06, page 14; e07, page 20), and costs "in
    Lakhs" (e07). District names are spelt differently across documents, for example Alleppey and
    Alappuzha, Kasargode and Kasaragode (e06, e07).
  evidence: [e06, e07]

source_check:
  status: pass
  detail: >-
    Plan rule: use district totals only at district resolution, with no invented ward truth. The
    memoranda give district totals and district rows (e06, e07, e11), so place_id is a district.
    Ward figures appear only as counts per district of flood-notified wards (e07, page 24), with
    no ward list, so no ward or taluk label is derived. The two inundation maps are images without
    a published vector layer, so no polygon label is digitised from them (e09, e10). For M08 this
    means: dated district labels exist for 2018 only, and sparsely (one table and narrative
    dates); no independent district-day positives and negatives before 2018 were found, which the
    M08 card needs for any forecasting claim (e06, e07, e11).
  evidence: [e06, e07, e09, e10, e11]


licence:
  status: restricted
  detail: >-
    Every page footer reads "Copyright © 2026.KERALA STATE DISASTER MANAGEMENT AUTHORITY. All
    rights reserved." and no open licence or terms of use is linked (e03, e04, e05). No licence
    statement was found in the memoranda or in the PDNA text (e06, e07, e08, e11). The PDFs stay in
    data/raw and are never redistributed. Only district-level facts with document and page
    citations are published, credited to KSDMA and the State Relief Commissioner.

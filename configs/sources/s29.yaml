source_check:
  status: pass
  detail: >-
    Plan rule: reconcile station/hobli aggregation; do not mix duplicate gauges with S27. Rows are
    marked D, T or H (district, taluk, hobli) in 2020-2024: 30/227/877 in 2020, 31/227/850 in
    2021 and 2022, 31/236/850 in 2024 (e04-e06, e08). Hobli name paths are unique except two
    repeats in 2021-2024 (850 rows, 848 paths), which must be flagged; 827 of 848 paths match
    between 2022 and 2024 because taluks were added. The 2025 file has no D/T/H marker, only a
    serial number that restarts (e09), so its levels cannot be told apart without inference. The
    2023 file is per station, not per hobli (e07), and is kept separate from S27's gauges.
  evidence: [e04, e05, e06, e07, e08, e09]


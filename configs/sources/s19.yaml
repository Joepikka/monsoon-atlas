units:
  status: labelled
  detail: >-
    The columns are latitude and longitude of the polygon centroid (degrees), area_in_meters
    (square metres), confidence ("confidence score [0.65;1.0] assigned by the model"), geometry
    (WKT POLYGON or MULTIPOLYGON) and full_plus_code (e01). The sample shard has exactly these six
    columns, 40,789 polygons, areas from 2.5 to 12,530 m2 (e04).
  evidence: [e01, e04]

source_check:
  status: pass
  detail: >-
    Plan rule: deduplicate within release; confidence 0..1; no ownership or inferred residents;
    >= 0.75 display default. In the sample shard no plus code or geometry repeats (e04), and
    confidence runs from 0.65 to 0.9704, inside 0..1 and the documented [0.65;1.0] (e01, e04);
    26,065 of 40,789 polygons reach 0.75. The page says there is "no information about the type of
    building, its street address, or any details other than its geometry" (e01), so nothing about
    owners or residents exists to drop; the project adds none. The map shows confidence >= 0.75 by
    default; the page's own explorer bands 0.65, 0.7 and 0.75 (e01).
  evidence: [e01, e04]


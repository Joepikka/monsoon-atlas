licence:
  status: open
  detail: >-
    "The data is shared under the Creative Commons Attribution (CC BY-4.0) license and the Open
    Data Commons Open Database License (ODbL) v1.0 license. As the user, you can pick which of the
    two licenses you prefer" (e01). The project uses the CC BY 4.0 branch, as the plan asks, and
    credits Google Research Open Buildings v3.
  evidence: [e01]

provider_quota:
  status: not_published
  detail: >-
    No request limit is published (e01). All polygons total 178 GB; Karnataka lies in one cell,
    3bb, whose file is 4,834.4 MB gzipped (e01, e02), so the adapter downloads that one file once
    per release and clips it.
  evidence: [e01, e02]

history:
  status: available
  detail: >-
    One static release per version: "v3 : inference carried out during May 2023" on imagery of
    Africa, South and South-East Asia and Latin America (e01). Rows carry no acquisition dates.
  evidence: [e01]
earliest_date: null

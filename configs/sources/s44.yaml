source_check:
  status: pass
  detail: >-
    Plan rule: published totals only; no names or case locations; harmonize boundaries;
    under-reporting caveat. The tables hold counts per police unit only, with no names or case
    locations (e04, e05). Units are police jurisdictions, not revenue districts: six city
    commissionerates (Bengaluru, Mysuru, Hubballi Dharwad, Mangaluru, Belagavi, Kalaburagi) are
    split from their districts, range rows are empty section headings, and Karnataka Railways,
    Coastal Security Police and CID have no area (e04); 2023 spells names differently (Shimoga, Kalaburgi, KRailways,
    e05). T088 keeps the published unit, skips the headings, marks non-area units, and maps to districts
    only where one unit equals one district. Registered cases are not incidence: every display
    carries an under-reporting caveat. Offence heads change between years, and from July 2024 the
    BNS replaced the IPC (e07), so heads are not compared across that break.
  evidence: [e04, e05, e07]


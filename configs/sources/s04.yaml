access:
  status: public_api_no_key
  detail: >-
    GET https://air-quality-api.open-meteo.com/v1/air-quality works without a key or account
    (e08, e10-e12); the docs say an API key is "Only required to commercial use" (e04). The API
    host robots.txt disallows all paths (e01); as in D31, API calls follow the published API
    terms and limits (e02). Requests were spaced 2 seconds apart.
  evidence: [e01, e02, e04, e08, e10, e11, e12]

licence:
  status: open
  detail: >-
    "API data are offered under Attribution 4.0 International (CC BY 4.0)"; the same page credits
    "Weather reanalysis, air quality forecasts and elevation data" to Copernicus (e03). The free API
    is for non-commercial use only (e02). The Copernicus licence link on that page returns 404 (see
    failed_fetches), so the upstream terms were not read. The docs ask users to attribute the CAMS
    data provider and Open-Meteo (e04): credit Open-Meteo and CAMS (Copernicus).
  evidence: [e02, e03, e04]

provider_quota:
  status: published
  detail: "Free non-commercial API: fewer than 10,000 calls per day, 5,000 per hour and 600 per minute (e02)."
  evidence: [e02]

history:
  status: available
  detail: >-
    The docs list CAMS Global Atmospheric Composition Forecasts (0.4 degree, 5 days, "August 2022
    onwards", updated every 12 hours) and two European-only datasets (e04). At Bengaluru every hour
    of 20 Jul to 3 Aug 2022 is null and the first value is 4 Aug 2022 00:00 UTC (e11); from then
    to 8 Nov 2026 23:00 UTC every hour has PM2.5, PM10 and NO2 (e12). The forecast on 9 Nov 2026
    has values to 13 Nov 12:00 UTC; data_end_time 13:00 UTC is exclusive and later hours are null
    (e07, e08). Past hours carry
    no run time, so they are a model archive, not forecasts stored at issue time.
  evidence: [e04, e07, e08, e11, e12]
earliest_date: "2022-08-04"
latest_date: "2026-11-13"

units:
  status: labelled
  detail: >-
    hourly_units gives pm2_5, pm10 and nitrogen_dioxide in "μg/m³" and time as iso8601; with
    timezone=GMT the response has utc_offset_seconds 0 (e08, e10-e12). The docs define them as
    instant values close to the surface (10 m above ground) (e04).
  evidence: [e04, e08, e10, e11, e12]

source_check:
  status: pass
  detail: >-
    Plan rule: pollutants >= 0; never label CAMS a CPCB observation; preserve issue and valid
    times. Every value from Aug 2022 to Nov 2026 is >= 0 (minimum PM2.5 0.4, PM10 0.6, NO2 0.0
    μg/m³) (e12). The docs call the data a CAMS forecast (e04): rows get provenance "model" and
    product cams_global, never an observation. The response has no run time (e08); the
    cams_global metadata, from the URL the Model Updates page script builds (e05, e06), gives
    last_run_initialisation_time 8 Nov 2026 12:00 UTC and availability 21:48:32 UTC, unchanged
    before and after the call (e07, e09). hourly.time is the valid time in UTC (e08).
  evidence: [e04, e05, e06, e07, e08, e09, e12]

field_map:
  - canonical: cell_id
    upstream: "latitude, longitude in the response"
    unit_status: not_applicable
    detail: "Snapped to the CAMS global grid: 12.97, 77.59 returns 13.0, 77.600006."
    evidence: [e08]
  - canonical: valid_at
    upstream: "hourly.time"
    unit_status: labelled
    detail: "ISO 8601 without offset; UTC because timezone=GMT is requested."
    evidence: [e04, e08]
  - canonical: issued_at
    upstream: "last_run_initialisation_time in data/cams_global/static/meta.json (Unix seconds)"
    unit_status: labelled
    detail: "Read before and after the forecast call; null for past hours, which carry no run time."
    evidence: [e06, e07, e09]
  - canonical: pm25_ugm3
    upstream: "pm2_5"
    unit_status: labelled
    detail: "μg/m³, instant value close to the surface; null where the run has no value."
    evidence: [e04, e08]
  - canonical: pm10_ugm3
    upstream: "pm10"
    unit_status: labelled
    detail: "μg/m³, instant value close to the surface."
    evidence: [e04, e08]
  - canonical: no2_ugm3
    upstream: "nitrogen_dioxide"
    unit_status: labelled
    detail: "μg/m³, instant value close to the surface."
    evidence: [e04, e08]
  - canonical: product
    upstream: "the domains request parameter (not echoed in the response)"
    unit_status: not_applicable
    detail: >-
      cams_global, named explicitly: the default auto returns identical values at Bengaluru
      (e08, e10); cams_europe has no data there (HTTP 400, failed_fetches).
    evidence: [e04, e08, e10]


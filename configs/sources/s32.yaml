  evidence: [e06]

provider_quota:
  status: not_published
  detail: "No quota or rate limit is published; robots.txt allows all paths (e01, e06)."
  evidence: [e01, e06]

history:
  status: partial
  detail: >-
    The earliest report with dam rows is 26 Oct 2023 (e03); 25 Oct 2023 and 15 Aug 2018 return the
    page header with no rows (e04, e05). A sample of the 1st and 15th of every month from Nov 2023
    to Nov 2026 (73 dates, e08 to e80) found rows from 15 Nov 2023 to 1 Aug 2024 and from
    1 Aug 2026 to 1 Nov 2026, and none from 15 Aug 2024 to 15 Jul 2026 (1 Nov 2023 is also empty).
    Each report also gives "Same day previous year" level and storage, which reaches back one year
    (Nov 2022 to Aug 2023, and Aug to Nov 2025). The Historic data page has yearly system
    statistics only, no daily dam levels (e07). No 2017 to 2022 daily history is published.
  evidence: [e03, e04, e05, e07, e08, e80]
earliest_date: "2023-10-26"
latest_date: "2026-11-05"

units:
  status: labelled
  detail: >-
    Column headers state the units: water level (metre), live storage (MCM), inflow (MU), rainfall
    (mm); alert levels, MWL, FRL and spillway crest (metre); live storage at FRL (MCM) (e02). Some
    cells override the header with an "ft" suffix: for Idukki and Sholayar the alert, MWL, FRL and
    spillway values are in feet ("2403ft"), so units are read per cell. Inflow MU is energy
    (million units, GWh), not a water volume or flow. The daily reports state no datum (e02). KSEB's dam manuals
    state levels above mean sea level only for the Idukki reservoir (Survey of India benchmarks, e81, e82),
    Sengulam (e83), Kakki-Anathode (e96) and Pamba (e97); the others give elevations with no
    named datum (e84-e95, e98), so those dams stay datum-unknown (D103). The earliest reports break the header units. On 26-Oct-2023 the Idukki
    and Sholayar levels are in feet (2353.98 and 2659.6, against about 719 and 811 m from
    15-Nov-2023). On 26-Oct-2023 and 15-Nov-2023 the % storage is 100 times too large (4921 for
    49.21). From 1-Dec-2023 every sampled value is consistent (e03, e09, e10). So T114 checks
    each row: level within the dam's own range in metres, and % storage equal to live storage
    divided by live storage at FRL; failing rows are quarantined, never rescaled silently.
  evidence: [e02, e03, e09, e10, e81, e82, e83, e84, e85, e86, e87, e88, e89, e90, e91, e92, e93, e94, e95, e96, e97, e98]

source_check:
  status: pass
  detail: >-
    Dam list verified: 16 dams in the report of 05-Nov-2026 (Idukki, Idamalayar, Kakki (Anathode),
    Banasurasagar, Sholayar, Madupetty, Anayirankal, Ponmudi, Kuttiyadi (Kakkayam), Pamba,
    Poringalkuthu, Kundala, Kallarkutty, Lower Periyar, Moozhiyar, Sengulam) (e02). Update date
    and time come from the page ("As on 05-Nov-2026 7.00 AM"), never from the fetch time; for all
    76 dated pages the "As on" date equals the requested date (e02 to e05, e08 to e80). Units and
    the missing datum are recorded above. Every sampled date with data has all 16 dams.
  evidence: [e02, e03, e04, e05, e08, e80]

field_map:
  - canonical: reservoir_id
    upstream: "Name of Dam / Reservoir"
    unit_status: not_applicable
    detail: "Dam name as published, for example 'KAKKI (ANATHODE )'; District code kept as an attribute."
    evidence: [e02]
  - canonical: date_local
    upstream: "'As on DD-Mon-YYYY' in the report title"
    unit_status: not_applicable
    detail: "Report date and 7.00 AM reading time in Asia/Kolkata; equals the requested date."
    evidence: [e02, e03]
  - canonical: level_m
    upstream: "Today's Water level (metre)"
    unit_status: labelled
    detail: "Metres; no datum stated. Previous-year column gives the same day one year earlier."
    evidence: [e02]
  - canonical: storage_mcm
    upstream: "Today's Live Storage (MCM)"
    unit_status: labelled
    detail: "Live (not gross) storage in million cubic metres."
    evidence: [e02]
  - canonical: capacity_mcm
    upstream: "Live Storage at FRL (MCM)"
    unit_status: labelled
    detail: "Live storage at full reservoir level, million cubic metres."
    evidence: [e02]
  - canonical: inflow_m3s
    upstream: "Inflow MU"
    unit_status: labelled
    detail: "Energy in million units, not m3/s: not converted. inflow_m3s stays null with reason 'not_reported'."
    evidence: [e02]


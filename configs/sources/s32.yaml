access:
  status: public_page
  detail: >-
    The daily report page is public. Its own date form (method GET, field "date") gives the report
    for any chosen day at the same URL with ?date=YYYY-MM-DD (e02, e03). robots.txt disallows
    nothing and sets no crawl delay (e01); requests were spaced 3 seconds apart. No account, key or
    card is needed.

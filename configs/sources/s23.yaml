history:
  status: available
  detail: >-
    Scope State=Karnataka, Commodity=Onion. Karnataka onion total is 103,423 rows on every page (e07 to e19), updated 2026-11-12T23:34:52Z;
    the earliest row seen is 10/01/2001 and the latest 12/11/2026 (e09 to e19, e24). Offset paging
    is NOT reliable: the 11 pages at limit 10000 returned 103,423 rows but only 93,423 distinct
    (page offset 0 shares 9,271 rows with offset 20000, which shares 729 with offset 40000; e09,
    e11, e13), and the limit-1000 first page shares no row with the limit-10000 first page (e07,
    e09). Sampled days queried with filters[Arrival_Date] return complete, stable sets that include
    rows the paging missed (e22, e23, e26); a backfill must therefore query one Arrival_Date per
    request. Distinct rows per year from the paging (a lower bound): 2001 14, 2002 3382, 2003 3300,
    2004 2665, 2005 2490, 2006 2132, 2007 3211, 2008 3467, 2009 3809, 2010 3944, 2011 4737, 2012
    5699, 2013 3186, 2014 3152, 2015 3810, 2016 3916, 2017 4046, 2018 4087, 2019 3890, 2020 4166,
    2021 3996, 2022 4496, 2023 4025, 2024 4356, 2025 2553, 2026 4894. Only Feb to Oct 2001 have no
    rows; 2025 is thin
    (105 to 195 distinct rows in each of Mar to Aug and Oct). Some days have no report (e21).
    Publication: 12/11/2026 is the latest day at capture (13 Nov, 10:00 UTC) while the daily
    resource already had 13/11/2026 rows, so the history lags by about one day (e24, e25, e27).
  evidence: [e07, e09, e11, e13, e19, e21, e22, e23, e24, e25, e26, e27]
earliest_date: "2001-01-10"
latest_date: "2026-11-12"

units:
  status: onion_only
  detail: >-
    Verified scope: State=Karnataka, Commodity=Onion only. The API carries no unit field (e09).
    The owner read AGMARKNET's daily price and arrival report
    for Onion, Karnataka on 12 Nov 2026: its "Price Unit" column says "Rs./Quintal" (owner-observed,
    decision D201). Units are per commodity, so only Onion is verified, at Rs./Quintal; every
    other commodity stays unverified until owner step H16 records its unit, and the T270 adapter
    refuses them. Within onion, some rows look like per-kg entries (for example Shimoga 2023-24
    modal 15 to 50, e09 to e19); these are a cleaning rule for T271, not a second unit.
  evidence: [e09, e19]

source_check:
  status: pass
  detail: >-
    Plan rule: pagination counts, date parsing, late reports, no invented resource UUID. The ID is
    echoed by the API (e07). Total stable at 103,423 across all pages (e07 to e19); duplicates come
    from unstable offset paging, so per-day queries are required (history). Dates parse as
    DD/MM/YYYY. In the 93,423 distinct paged rows: 20 break min <= modal <= max, 31 have a zero
    min or max, no modal is <= 0, modal ranges 1 to 20000 (26 below 100, 39 above 10000, 30 of
    them in the 2019 onion spike), 3 keys (date, district, market, variety, grade) repeat with
    different prices. Prices and Commodity_Code are strings in older rows and integers from
    Nov 2025 (both types appear 1 to 4 Nov 2025; e09 to e19). Names vary: 41 district spellings (Bangalore/Bengaluru,
    Belgaum/Belagavi, Mysore/Mysuru, Shimoga/Shivamogga, Tumkur/Tumakuru, Kalburgi/Kalaburagi
    and others), 164 market names (an "APMC" suffix appears from Nov 2025) and 11 markets filed
    under two district names. These are T271 cleaning and crosswalk rules, not blockers.
  evidence: [e07, e09, e10, e11, e12, e13, e14, e15, e16, e17, e18, e19]


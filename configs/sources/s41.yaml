    attempted_at: "2026-11-09T15:47:31Z"
    error: "HTTP 404: no RSS page at this path"
  - url: "https://www.deccanherald.com/rss"
    attempted_at: "2026-11-09T15:47:35Z"
    error: "HTTP 404: no RSS page at this path"

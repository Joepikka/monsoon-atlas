history:
  status: available
  detail: >-
    The docs list ERA5 as global 0.25 degree, hourly, "1940 to present", updated "Daily with 5
    days delay" (e04). The 1940 sample returns values from 1 Jan 1940, but precipitation for that
    first local day is null, because an IST day starts at 18:30 UTC the day before (e06). On 5 Nov
    2026 at 13:01 UTC the newest day with values was 30 Oct 2026; 31 Oct to 4 Nov were null (e05).
  evidence: [e04, e05, e06]
earliest_date: "1940-01-02"
latest_date: "2026-10-30"

units:
  status: labelled
  detail: >-
    Units are requested explicitly (temperature_unit=celsius, precipitation_unit=mm,
    timezone=Asia/Kolkata) and echoed in daily_units: mm, °C and iso8601; utc_offset_seconds is
    19800 (e05, e06, e07). Daily values are 24-hour aggregations of hourly values in the requested
    time zone (e04).
  evidence: [e04, e05, e06, e07]

source_check:
  status: pass
  detail: >-
    Plan rule: do not call reanalysis observations or assume it existed at forecast time; preserve
    release lag. ERA5 is a reanalysis (model output), so rows get provenance "model", never
    "official" observations (e04). The docs state a 5-day delay and the sample shows 6 days at the
    latest IST day (e04, e05). A value for day D was therefore not available before about D + 6
    days; T012 must keep available_at at the real fetch time, and any backtest that uses older
    ERA5 rows must apply that lag and label itself a hindcast (plan D07). The July 2024 Bengaluru
    total is 264.2 mm, a reanalysis value that need not match rain gauges (e07).
  evidence: [e04, e05, e07]


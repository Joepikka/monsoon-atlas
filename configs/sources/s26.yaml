landing_url: "https://aisstream.io"
publisher: "AIS Stream (aisstream.io)"
no_card: true
account_required: true

access:
  status: key_required_owner_step
  detail: >-
    The only access is the WebSocket wss://stream.aisstream.io/v0/stream. The first message must
    carry an APIKey, and "Sign in with GitHub and create an API key in Account" (e01, e03). Signing
    in and creating the key is owner step H12 (amendments A5); no key is configured, so no
    connection was opened. Direct browser connections are not permitted (e03), and the docs list
    no REST or download endpoint. No card is asked for on the captured pages ("for free", e01).
  evidence: [e01, e03]

licence:
  status: unverified
  detail: >-
    No data licence or terms of service page is linked from the site: the footer links only to
    Documentation, Account, Privacy and Support (e01, e04), and the privacy policy covers visitor
    and account (GitHub identity) information, not reuse of AIS data (e04). The MIT licence in
    the ais-message-models repository covers the model definitions, not the stream (e07). Terms
    that apply at sign-in could not be read without an account.
  evidence: [e01, e04, e07]

provider_quota:
  status: published
  detail: >-
    3 subscribed connections per account; 3 open connections per originating IP; the first
    subscription within 3 seconds; 1 subscription update per second per connection; up to 200 MMSI
    filters; slow readers lose messages; no SLA or uptime guarantee and events are not durably
    replayed; from September 2026 uncompressed connections have per-user bandwidth limits (e03).
  evidence: [e03]

history:
  status: not_public
  detail: >-
    A live event stream only: "events are not durably replayed", and the docs describe no archive
    or history endpoint (e03).
  evidence: [e03]
earliest_date: null
latest_date: null

units:
  status: labelled
  detail: >-
    PositionReport documents Sog as speed over ground in knots, Cog as course over ground in
    degrees, TrueHeading in degrees, Latitude and Longitude in decimal degrees and Timestamp as an
    AIS UTC-second timestamp (e03). No sample row was fetched, because no key exists.
  evidence: [e03]

source_check:
  status: blocked
  detail: >-
    Plan check: terms and websocket quotas unverified; no coastal coverage assumption; disable if
    unavailable. Quotas are published (e03) but the terms are not (e04) and the stream needs the
    owner's key (e01, e03), so nothing live was checked. The docs give no coverage map or list of
    receiving stations for the Kerala coast (e03), so no coastal coverage is assumed; the source
    stays disabled. The documented example repository is client code only and needs the same key
    (e06).
  evidence: [e01, e03, e04, e06]


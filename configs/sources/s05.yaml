history:
  status: partial
  detail: >-
    Forecast only. start_date 1 Jul 2024 gets HTTP 400 "out of allowed range from 2026-08-08 to
    2026-12-14" (failed_fetches); inside that range 8-9 Aug 2026 is all null (e13), and IFS 0.25
    ensemble values start on 4 Nov 2026 22:00 UTC with no gaps to 8 Nov (e14). So the API keeps
    about 4.5 days of past values, not an archive of runs: every run must be stored when issued
    (D07). The 9 Nov sample has values to 23 Nov 2026 12:00 UTC (e08).
  evidence: [e08, e13, e14]
earliest_date: "2026-11-04"
latest_date: "2026-11-23"

units:
  status: labelled
  detail: >-
    hourly_units gives every precipitation series in "mm" and every temperature_2m series in
    "°C", with time as iso8601; temperature_unit=celsius, precipitation_unit=mm and timezone=GMT
    are requested, and utc_offset_seconds is 0 (e08, e10-e12). The docs say all data is
    interpolated to 1-hourly steps and precipitation is the sum over the preceding hour (e04).
  evidence: [e04, e08, e10, e11, e12]

source_check:
  status: pass
  detail: >-
    Plan rule: discover the actual member count per product; do not hardcode 40. At Bengaluru each
    response has one unsuffixed series plus numbered members, the same count for rain and
    temperature: ECMWF IFS 0.25 ensemble 51 (member01-member50, e08), NOAA GFS 0.25 ensemble 31
    (e10), DWD ICON-EPS 40 (e11), CMC GEM 21 (e12), as the docs table lists (e04). Only ICON-EPS
    has 40. The response names no run time; the ecmwf_ifs025_ensemble metadata, from the URL the
    Model Updates page script builds (e05, e06), gives last_run_initialisation_time 8 Nov 2026
    18:00 UTC, availability 9 Nov 02:43:50 UTC and data_end_time 14 Nov 21:00 UTC, unchanged before
    and after the call (e07, e09). The response still has values to 23 Nov 12:00 UTC, which is
    8 Nov 12:00 plus the 15-day length (e04, e08): hours from data_end_time on are consistent with
    an earlier run, so only hours before data_end_time carry the metadata run time. Six IFS member
    values are -0.1 mm (members 16 and 37, e08); rain must be >= 0, so T052 rejects them.
  evidence: [e04, e05, e06, e07, e08, e09, e10, e11, e12]


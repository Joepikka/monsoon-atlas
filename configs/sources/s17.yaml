source_check:
  status: pass
  detail: >-
    Plan rule: no assumption that 736 is current; valid polygons; preserve version and
    disputed-boundary metadata; ADM2 does not establish ward or taluk coverage. The metadata says
    admUnitCount 736, but the ADM2 file has 735 features (e03, e06), so counts come from the file.
    Karnataka gets 30 districts by containment in the ADM1 Karnataka polygon; Vijayanagara (formed
    in 2021 from Ballari) is missing, so these are older district lines (e05, e06). All 735 shape
    IDs are unique and every ring is closed (e06); full validity checks need shapely (geo lock,
    T032). No disputed-boundary field exists in the metadata or feature properties (e03, e04, e06);
    ADM1 is a 2011 vintage that still shows Jammu and Kashmir as one unit (e05). Public maps must
    follow India's mapping guidance (owner check at H11). ADM2 gives districts only; it says
    nothing about wards or taluks.
  evidence: [e03, e04, e05, e06]


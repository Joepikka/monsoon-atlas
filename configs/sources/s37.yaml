access:
  status: pdf_only_no_point_data
  detail: >-
    The only landslide file NRSC publishes on its site is the Landslide Atlas of India PDF, linked
    from the Landslide Atlas page (e05) and downloaded without an account (e07, 94 pages, 29 MB,
    2023 edition updated 25 Aug 2023). It holds maps as figures and Table 2 with landslide counts per
    state, season and event year. The point inventory (about 80,000 landslides) is said to be
    "available in a web GIS platform in the Bhuvan portal" (e07, page 19). The Bhuvan page linked from
    the NRSC home page is a client-rendered app shell with no download link or data service
    description (e08), and the NRSC pages link no shapefile, GeoJSON or CSV (e02, e03, e05). No
    endpoint was guessed. No row with a landslide ID or coordinates could be downloaded.
  evidence: [e01, e02, e03, e05, e07, e08]

licence:
  status: restricted
  detail: >-
    Terms and Conditions: content is copyright NRSC, ISRO; downloadable content may be used for
    non-commercial purposes with the attribution "Source: NRSC, ISRO/DOS" and a link to
    www.nrsc.gov.in; derivative works are allowed; all data remain NRSC property (e06). The Atlas
    front matter allows reproduction for educational or non-profit purposes with acknowledgement and
    citation, and forbids resale and other commercial use (e07). The footer reads "All Rights Reserved"
    (e01). No open licence applies, so the PDF stays in data/raw and is not redistributed.
  evidence: [e01, e06, e07]

provider_quota:
  status: not_published
  detail: >-
    No quota is published. robots.txt returns HTTP 404 on www.nrsc.gov.in and on bhuvan.nrsc.gov.in
    (see failed_fetches). Requests were spaced 3 seconds apart.
  evidence: [e01]

history:
  status: partial
  detail: >-
    Table 2 of the Atlas gives Kerala counts only: 9 landslides mapped for the 2014 monsoon, 45 for
    2017, and event-based inventories of 5,191 (2018), 756 (2019), 9 (2020) and 29 (2021), 6,039 in
    all (e07, page 19). The Landslide Atlas page and the Atlas say the database covers 1998 to 2022
    nationally, in three types: seasonal (2014 and 2017), event-based and route-wise (e05, e07).
    No per-landslide occurrence date is published in these files; the years above are inventory
    labels per event.
  evidence: [e05, e07]
earliest_date: "2014-06-01"
latest_date: "2021-12-31"

units:
  status: not_checked
  detail: >-
    Table 2 counts landslides per state with no unit beyond the count. No coordinate, CRS, location
    error or area unit was seen, because no per-landslide record is published (e07).
  evidence: [e07]

source_check:
  status: fail
  detail: >-
    Plan rule: Atlas maps are not necessarily reusable geospatial labels, and unknown occurrence
    dates exclude temporal scoring. The Atlas maps for Kerala (Figure 41, 2014 to 2021) are images
    with no coordinates or IDs in the file (e07), and the only machine-readable Kerala facts are the
    six counts in Table 2. M09 needs at least 200 independent landslides with positional error of
    100 m or less and a survey footprint (plan T136). None of that is downloadable, so the
    inventory cannot serve as labels, and no temporal scoring is possible.
  evidence: [e05, e07, e08]


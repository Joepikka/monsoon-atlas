  evidence: [e02]

provider_quota:
  status: not_published
  detail: "No quota is published (e01, e02); robots.txt returns 404 (see failed_fetches)."
  evidence: [e01, e02]

history:
  status: partial
  detail: >-
    The feed holds only the latest 100 items: on 5 Nov 2026 at 13:05 UTC they ran from 4 Nov 2026
    15:55:40 GMT to 5 Nov 2026 12:35:12 GMT, about 21 hours (e02). No archive is linked, so history
    starts when the project begins polling (schedule every 15 minutes). The channel pubDate is
    stale (16 Oct 2026) and must not be used for freshness; item pubDates are current (e02).
  evidence: [e02]
earliest_date: "2026-11-04"
latest_date: "2026-11-05"

units:
  status: not_applicable
  detail: >-
    Alerts have no measured units. Times carry explicit offsets, for example
    2026-11-05T18:05:10+05:30 (e03). Severity uses the CAP words Moderate, Severe and Extreme (e03,
    e06, e08).
  evidence: [e03, e06, e08]

source_check:
  status: pass
  detail: >-
    Plan rule: CAP updates and cancellations supersede old alerts; missing geometry stays area
    text; do not infer lightning from rain. The samples include msgType Update with references in
    the CAP form sender,identifier,sent, for example "IMD-Bengaluru,IN-1793881986295019_51,..." in a
    Karnataka-SNDMC update (e03, e05, e08, e09), and msgType Alert without references (e06, e07). No
    Cancel was in the samples, but CAP 1.2 defines it, so T014 handles Update and Cancel the same
    way. Geometry: every sample names a polygon file, and e04 holds lat,lon rings (14 rings, each
    listed twice). Some alerts have LGD district codes (e03, e05, e07), others only area text such
    as "central Kerala" (e08); area text is always kept. Events are taken as written, for example
    "Thunderstorm with Lightning" (e03) and "Moderate Rain" (e07); no event is inferred.
  evidence: [e03, e04, e05, e06, e07, e08, e09]


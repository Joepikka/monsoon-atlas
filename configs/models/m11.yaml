  tune_calibrate: ["2023-01-01", "2023-12-31"]
  locked_test: ["2024-01-01", "2024-12-31"]
  note: >-
    Separate from the 2018 replay. If common 2023-24 labels are absent the plan waits for a
    prospective 2027 monsoon set.
split_manifest: null
status: blocked
reason: >-
  M11 blocked: it freezes the Karnataka flood model M01 and needs common Kerala flood labels, but
  M01 is blocked (S43 has no official dated ward-level inundation records, T085) and M08 is

# Planned M12 definition, not a fitted model or a claim that labels exist. T153.
model_id: M12
state: dl
enabled: false
task: regression
unit: "vehicle x trip x stop x sampled position"
sources: [S38]
target: >-
  seconds until the first observed stop arrival (within 30 m, dwell >= 10 s, or crossed stop with
  interpolation gap <= 120 s); delay = observed arrival minus static GTFS scheduled arrival;
  label source S38 only
data_gate:
  min_service_days: 60
  min_routes: 20
  min_matched_completed_stop_arrivals: 5000

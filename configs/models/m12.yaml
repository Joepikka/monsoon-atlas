  - schedule ETA
  - distance over current speed capped at 1..25 m/s
  - median route-stop-time-of-week from training
candidates: [ridge, random_forest, lightgbm_quantile]
provisional_candidate: lightgbm
purge: target horizon
planned_splits:
  collect_from: "2028-01-17"
  train: ["2028-01-17", "2028-03-28"]
  tune: ["2028-03-29", "2028-04-12"]
  calibrate: ["2028-04-13", "2028-04-26"]
  locked_test: ["2028-04-27", "2028-05-26"]
  note: >-
    Planned only. Dates assume source approval and readiness pass on schedule; if delayed the
    whole manifest shifts before training. No observation earlier than collection is invented.
split_manifest: null
status: blocked
reason: >-
  M12 blocked: S38 is blocked on owner step H04 (D135), so no static GTFS, real-time sample or
  trip linkage was read and there are 0 vehicle positions and 0 service days; a scheduled-delay

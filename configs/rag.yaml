# T252 (child of plan T179): English Karnataka MVP Ask corpus (D87).
# Only committed, project-owned documents are indexed. Raw source data, news, reviews,
# research about other products and credentials are never part of the corpus.
chunk_tokens: 300
overlap_tokens: 50
candidates: 50
top_k: 5
max_context_tokens: 3000
licences: ["project-mit"]
documents:

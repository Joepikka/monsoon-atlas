# T252 (child of plan T179): English Karnataka MVP Ask corpus (D87).
# Only committed, project-owned documents are indexed. Raw source data, news, reviews,
# research about other products and credentials are never part of the corpus.
chunk_tokens: 300
overlap_tokens: 50
candidates: 50
top_k: 5
rerank_method: R0  # D99: chosen on dev cases only (reports/rag-rerank.md)
# D100: append-only logs that grow with every task
log_documents: [project/decisions, project/amendments]
log_rule: L0  # set from reports/rag-logs.md after the dev-only selection
max_context_tokens: 3000
licences: ["project-mit"]
# T255 (D90): frozen structured files the numeric path may query. These are committed real
# samples standing in until a published snapshot exists (S02 and S09 credit their providers).
snapshots:
  - {kind: daily_rain, source_id: S02, places: [bengaluru], path: tests/fixtures/s02_openmeteo_era5_bengaluru_2026-10-20_11-04.json}
  - {kind: alerts, source_id: S09, path: web/tests/fixtures/sachet-ka-point.json, unit: alert_id}
  - {kind: model_release, source_id: M05, path: models/registry/M05/v1.json, unit: SPI-3 MAE improvement}

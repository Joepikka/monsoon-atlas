  - {doc_id: project/readme, path: README.md, kind: project, states: [all]}
  - {doc_id: project/rules, path: AGENTS.md, kind: project, states: [all]}
  - {doc_id: project/methods, path: docs/methods.md, kind: project, states: [all]}

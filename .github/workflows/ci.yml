# Core imports, lint and tests on Windows and Ubuntu with Python 3.12 (plan T007).
# Actions are pinned to audited commit SHAs; the token is read-only; no secrets are used,
# so fork pull requests cannot reach any.
name: ci

on:
  push:
    branches: [main, "setup/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked core and dev requirements
        run: |
          python -m pip install --require-hashes -r requirements/core.txt
          python -m pip install --require-hashes -r requirements/dev.txt
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Core imports (no torch)
        run: python -c "import atlas.cli, atlas.data.store, atlas.ingest.http, sys; assert 'torch' not in sys.modules"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Source and dependency policy
        run: python scripts/audit_dependencies.py --policy
      - name: Tests
        run: python -m pytest -q

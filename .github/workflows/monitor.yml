# T219 (D163): run the monitoring checks on the committed repository state and print the result
# in the job summary, an owner-run log. Manual dispatch only: no schedule, no notification, no
# message to any person or channel, nothing secret. Not dispatched yet. Actions are pinned to
# audited commit SHAs; the token can only read.
name: monitor

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked core requirements
        run: |
          python -m pip install --require-hashes -r requirements/core.txt
          python -m pip install --no-deps -e .
      - name: Monitoring checks (job summary only)
        run: python -m atlas.monitoring | tee -a "$GITHUB_STEP_SUMMARY"

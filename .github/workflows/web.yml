name: Web shell
on:
  push:
    paths: ['web/**', 'scripts/web.ps1', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', 'scripts/web.ps1', '.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  web:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      npm_config_cache: ${{ github.workspace }}/.cache/npm
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.16.0'
      - name: Keep temporary files in the workspace
        shell: pwsh
        run: |
          $atlasTemp = Join-Path '${{ github.workspace }}' '.cache/tmp'
          New-Item -ItemType Directory -Force -Path $atlasTemp | Out-Null
          "TEMP=$atlasTemp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMP=$atlasTemp" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TMPDIR=$atlasTemp" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run test:e2e -- shell.spec.ts
        working-directory: web

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "monsoon-atlas"
version = "0.0.1"
description = "Regional intelligence map of Indian states with honestly evaluated forecasts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
# Runtime pins live in requirements/core.txt (hash-locked); install with --no-deps -e .

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as argument defaults by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Drive C is nearly full: pytest temp files stay on drive D with the repo. pytest creates
# only the last folder of --basetemp, so it sits at the repo root (fresh CI checkouts too).
addopts = "--basetemp=.pytest-tmp"

[tool.pip-tools]
# Drive C is nearly full: the lock download cache stays on drive D with the repo.
cache-dir = ".cache/pip-tools"
# Pin pip and setuptools too, so a fresh environment installs with --require-hashes.
allow-unsafe = true
generate-hashes = true
strip-extras = true
